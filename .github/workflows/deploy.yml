# =====================================================
# UtilPro — Full Automation Pipeline
# Triggers on every push to main branch
# =====================================================
name: 🚀 Auto Deploy UtilPro

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:

  # ─── JOB 1: DEPLOY TO NETLIFY ─────────────────────
  deploy-netlify:
    name: 🌐 Deploy to Netlify
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install Netlify CLI
        run: npm install -g netlify-cli

      - name: 🚀 Deploy to Netlify (Production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy \
            --dir=. \
            --prod \
            --message="Auto deploy: ${{ github.event.head_commit.message }}"

      - name: ✅ Print live URL
        run: echo "🌐 Live at https://utilpro.netlify.app"

  # ─── JOB 2: SEO PING ──────────────────────────────
  seo-ping:
    name: 🔍 Ping Search Engines
    runs-on: ubuntu-latest
    needs: deploy-netlify
    steps:
      - name: 📡 Ping Google (sitemap)
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://utilpro.netlify.app/sitemap.xml" || true
          echo "✅ Google pinged"

      - name: 📡 Ping Bing (sitemap)
        run: |
          curl -s "https://www.bing.com/ping?sitemap=https://utilpro.netlify.app/sitemap.xml" || true
          echo "✅ Bing pinged"

  # ─── JOB 3: HEALTH CHECK ──────────────────────────
  health-check:
    name: ✅ Site Health Check
    runs-on: ubuntu-latest
    needs: deploy-netlify
    steps:
      - name: 🏠 Check Homepage
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.netlify.app/)
          echo "Homepage: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then exit 1; fi

      - name: 🔧 Check Tools Page
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.netlify.app/tools/pdf-tools.html)
          echo "PDF Tools: HTTP $STATUS"

      - name: 🗺️ Check Sitemap
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.netlify.app/sitemap.xml)
          echo "Sitemap: HTTP $STATUS"

      - name: ✅ All checks passed!
        run: echo "🎉 Site is live and healthy!"

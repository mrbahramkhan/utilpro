# =====================================================
# UtilPro — Full Automation Pipeline
# GitHub → Netlify auto-deploys (already connected)
# This workflow adds: SEO ping + Health check
# =====================================================
name: 🚀 UtilPro Auto Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ─── JOB 1: SEO PING ──────────────────────────────
  seo-ping:
    name: 🔍 Ping Search Engines
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ Wait for Netlify deploy (60s)
        run: sleep 60

      - name: 📡 Ping Google Sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://utilpro.netlify.app/sitemap.xml" || true
          echo "✅ Google pinged"

      - name: 📡 Ping Bing Sitemap
        run: |
          curl -s "https://www.bing.com/ping?sitemap=https://utilpro.netlify.app/sitemap.xml" || true
          echo "✅ Bing pinged"

      - name: 📡 Ping IndexNow (fast indexing)
        run: |
          curl -s "https://api.indexnow.org/indexnow?url=https://utilpro.netlify.app/sitemap.xml&key=utilpro2026" || true
          echo "✅ IndexNow pinged"

  # ─── JOB 2: HEALTH CHECK ──────────────────────────
  health-check:
    name: ✅ Health Check
    runs-on: ubuntu-latest
    needs: seo-ping
    steps:
      - name: 🏠 Homepage
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.netlify.app/)
          echo "Homepage: HTTP $S"; [ "$S" = "200" ] && echo "✅ OK" || echo "⚠️ Issue"

      - name: 📄 PDF Tools
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.netlify.app/tools/pdf-tools.html)
          echo "PDF Tools: HTTP $S"; [ "$S" = "200" ] && echo "✅ OK" || echo "⚠️ Issue"

      - name: 🔧 EMI Calculator
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.netlify.app/tools/emi-calculator.html)
          echo "EMI Calc: HTTP $S"; [ "$S" = "200" ] && echo "✅ OK" || echo "⚠️ Issue"

      - name: 🗺️ Sitemap
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.netlify.app/sitemap.xml)
          echo "Sitemap: HTTP $S"; [ "$S" = "200" ] && echo "✅ OK" || echo "⚠️ Issue"

      - name: 🔐 Admin Panel
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.netlify.app/admin.html)
          echo "Admin: HTTP $S"; [ "$S" = "200" ] && echo "✅ OK" || echo "⚠️ Issue"

      - name: 🎉 Summary
        run: |
          echo "================================================"
          echo "  ✅ UtilPro is live at utilpro.netlify.app"
          echo "  📊 GA4: G-X52KR4FG9X tracking active"
          echo "  💰 AdSense: ca-pub-3332637557301277"
          echo "  🔍 SEO pings sent to Google + Bing"
          echo "================================================"

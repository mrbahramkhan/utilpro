<script>
const zones = [
  { label: '🇵🇰 Pakistan (PKT)', tz: 'Asia/Karachi' },
  { label: '🇺🇸 New York (EST)', tz: 'America/New_York' },
  { label: '🇺🇸 Los Angeles (PST)', tz: 'America/Los_Angeles' },
  { label: '🇬🇧 London (GMT)', tz: 'Europe/London' },
  { label: '🇦🇪 Dubai (GST)', tz: 'Asia/Dubai' },
  { label: '🇸🇦 Riyadh (AST)', tz: 'Asia/Riyadh' },
  { label: '🇮🇳 India (IST)', tz: 'Asia/Kolkata' },
  { label: '🇧🇩 Bangladesh (BST)', tz: 'Asia/Dhaka' },
  { label: '🇩🇪 Germany (CET)', tz: 'Europe/Berlin' },
  { label: '🇫🇷 France (CET)', tz: 'Europe/Paris' },
  { label: '🇦🇺 Sydney (AEDT)', tz: 'Australia/Sydney' },
  { label: '🇯🇵 Tokyo (JST)', tz: 'Asia/Tokyo' },
  { label: '🇨🇳 Beijing (CST)', tz: 'Asia/Shanghai' },
  { label: '🇸🇬 Singapore (SGT)', tz: 'Asia/Singapore' },
  { label: '🇨🇦 Toronto (EST)', tz: 'America/Toronto' },
  { label: '🇲🇾 Kuala Lumpur', tz: 'Asia/Kuala_Lumpur' },
  { label: '🇹🇷 Istanbul (TRT)', tz: 'Europe/Istanbul' },
  { label: '🇧🇷 São Paulo (BRT)', tz: 'America/Sao_Paulo' },
];

const fromSel = document.getElementById('fromTZ');
const toSel = document.getElementById('toTZ');
zones.forEach(z => {
  fromSel.innerHTML += `<option value="${z.tz}">${z.label}</option>`;
  toSel.innerHTML += `<option value="${z.tz}">${z.label}</option>`;
});
fromSel.value = 'Asia/Karachi';
toSel.value = 'America/New_York';

function setNow() {
  const now = new Date();
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0,16);
  document.getElementById('inputTime').value = local;
}

function convertTime() {
  const inputVal = document.getElementById('inputTime').value;
  const fromTZ = document.getElementById('fromTZ').value;
  const toTZ = document.getElementById('toTZ').value;
  if (!inputVal) { alert('Please select a date and time.'); return; }

  const [date, time] = inputVal.split('T');
  const [year, month, day] = date.split('-').map(Number);
  const [hour, min] = time.split(':').map(Number);

  // Create date in source timezone
  const fromDateStr = `${date}T${time}:00`;
  const fromDate = new Date(fromDateStr);

  // Get offset difference
  const fromOffset = getOffset(fromTZ, fromDate);
  const toOffset = getOffset(toTZ, fromDate);
  const diffMs = (toOffset - fromOffset) * 60 * 1000;
  const converted = new Date(fromDate.getTime() + diffMs);

  const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:true };
  const result = converted.toLocaleString('en-US', opts);
  const fromLabel = zones.find(z => z.tz === fromTZ)?.label || fromTZ;
  const toLabel = zones.find(z => z.tz === toTZ)?.label || toTZ;
  const diffH = (toOffset - fromOffset) / 60;

  document.getElementById('fromLabel').textContent = `Converted from ${fromLabel}`;
  document.getElementById('convertedTime').textContent = result;
  document.getElementById('diffLabel').textContent = `Time difference: ${diffH >= 0 ? '+' : ''}${diffH} hours`;
  document.getElementById('resultBox').classList.add('show');
}

function getOffset(tz, date) {
  const utcStr = date.toLocaleString('en-US', { timeZone: 'UTC' });
  const tzStr = date.toLocaleString('en-US', { timeZone: tz });
  return (new Date(tzStr) - new Date(utcStr)) / 60000;
}

function swapZones() {
  const tmp = fromSel.value; fromSel.value = toSel.value; toSel.value = tmp;
}

// World clock
const clockZones = zones.slice(0, 12);
function updateClock() {
  const container = document.getElementById('worldClock');
  container.innerHTML = '';
  clockZones.forEach(z => {
    const now = new Date().toLocaleString('en-US', { timeZone: z.tz, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true });
    const dayDate = new Date().toLocaleDateString('en-US', { timeZone: z.tz, weekday:'short', month:'short', day:'numeric' });
    container.innerHTML += `
      <div style="background:#f8f9fc; border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center;">
        <div style="font-size:0.78rem; color:var(--text-light); margin-bottom:4px;">${z.label}</div>
        <div style="font-size:1.2rem; font-weight:700; font-family:monospace; color:var(--text-dark);">${now}</div>
        <div style="font-size:0.74rem; color:var(--text-light); margin-top:2px;">${dayDate}</div>
      </div>`;
  });
}
updateClock();
setInterval(updateClock, 1000);
setNow();
</script>

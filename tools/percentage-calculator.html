<div class="tool-header"><div class="tool-container"><h1>% Percentage Calculator</h1><p>Solve any percentage problem instantly.</p></div></div>
<div class="tool-body"><div class="tool-container">
  <div class="ad-slot ad-slot-horizontal" style="margin-bottom:28px;"><div>📢 Advertisement</div></div>

  <!-- Calculator 1 -->
  <div class="tool-card-main" style="margin-bottom:20px;">
    <h3>What is X% of Y?</h3>
    <div class="row-2" style="margin-top:16px;">
      <div class="form-group"><label>Percentage (%)</label><input type="number" id="p1x" placeholder="e.g. 15"></div>
      <div class="form-group"><label>Of Number</label><input type="number" id="p1y" placeholder="e.g. 200"></div>
    </div>
    <button class="btn btn-primary" onclick="calc1()">Calculate</button>
    <div class="result-box" id="r1" style="margin-top:16px;"><div class="result-value" id="r1v">—</div><div class="result-sub" id="r1s">—</div></div>
  </div>

  <!-- Calculator 2 -->
  <div class="tool-card-main" style="margin-bottom:20px;">
    <h3>X is What % of Y?</h3>
    <div class="row-2" style="margin-top:16px;">
      <div class="form-group"><label>Number (X)</label><input type="number" id="p2x" placeholder="e.g. 30"></div>
      <div class="form-group"><label>Total (Y)</label><input type="number" id="p2y" placeholder="e.g. 200"></div>
    </div>
    <button class="btn btn-primary" onclick="calc2()">Calculate</button>
    <div class="result-box" id="r2" style="margin-top:16px;"><div class="result-value" id="r2v">—</div><div class="result-sub" id="r2s">—</div></div>
  </div>

  <!-- Calculator 3 -->
  <div class="tool-card-main" style="margin-bottom:20px;">
    <h3>Percentage Increase / Decrease</h3>
    <div class="row-2" style="margin-top:16px;">
      <div class="form-group"><label>Original Value</label><input type="number" id="p3x" placeholder="e.g. 100"></div>
      <div class="form-group"><label>New Value</label><input type="number" id="p3y" placeholder="e.g. 125"></div>
    </div>
    <button class="btn btn-primary" onclick="calc3()">Calculate</button>
    <div class="result-box" id="r3" style="margin-top:16px;"><div class="result-value" id="r3v">—</div><div class="result-sub" id="r3s">—</div></div>
  </div>

  <!-- Calculator 4 -->
  <div class="tool-card-main">
    <h3>Discount Calculator</h3>
    <div class="row-3" style="margin-top:16px;">
      <div class="form-group"><label>Original Price</label><input type="number" id="p4price" placeholder="e.g. 5000"></div>
      <div class="form-group"><label>Discount (%)</label><input type="number" id="p4disc" placeholder="e.g. 20"></div>
      <div class="form-group"><label>Result</label><input type="text" id="p4result" readonly style="background:#f8f9fc; font-weight:700; color:var(--primary);"></div>
    </div>
    <button class="btn btn-primary" onclick="calc4()">Calculate Discount</button>
  </div>

<script>
function showResult(id, value, sub) {
  document.getElementById(id+'v').textContent = value;
  document.getElementById(id+'s').textContent = sub;
  document.getElementById(id).classList.add('show');
}
function calc1() {
  const x = parseFloat(document.getElementById('p1x').value);
  const y = parseFloat(document.getElementById('p1y').value);
  if (!x || !y) return;
  const result = (x / 100) * y;
  showResult('r1', result.toFixed(2), `${x}% of ${y} = ${result.toFixed(2)}`);
}
function calc2() {
  const x = parseFloat(document.getElementById('p2x').value);
  const y = parseFloat(document.getElementById('p2y').value);
  if (!x || !y) return;
  const result = (x / y) * 100;
  showResult('r2', result.toFixed(2) + '%', `${x} is ${result.toFixed(2)}% of ${y}`);
}
function calc3() {
  const x = parseFloat(document.getElementById('p3x').value);
  const y = parseFloat(document.getElementById('p3y').value);
  if (!x || !y) return;
  const pct = ((y - x) / x) * 100;
  const dir = pct >= 0 ? '📈 Increase' : '📉 Decrease';
  showResult('r3', Math.abs(pct).toFixed(2) + '%', `${dir}: from ${x} to ${y} is ${Math.abs(pct).toFixed(2)}% ${pct >= 0 ? 'more' : 'less'}`);
}
function calc4() {
  const price = parseFloat(document.getElementById('p4price').value);
  const disc = parseFloat(document.getElementById('p4disc').value);
  if (!price || !disc) return;
  const saved = (price * disc) / 100;
  const final = price - saved;
  document.getElementById('p4result').value = `Final: ${final.toFixed(2)} (Save: ${saved.toFixed(2)})`;
}
</script>

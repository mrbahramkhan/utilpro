    <!-- Category Tabs -->

      <button class="btn btn-primary btn-sm" onclick="setCategory('weight')" id="tab-weight">⚖️ Weight</button>
      <button class="btn btn-outline btn-sm" onclick="setCategory('length')" id="tab-length">📏 Length</button>
      <button class="btn btn-outline btn-sm" onclick="setCategory('temperature')" id="tab-temperature">🌡️ Temp</button>
      <button class="btn btn-outline btn-sm" onclick="setCategory('volume')" id="tab-volume">💧 Volume</button>
      <button class="btn btn-outline btn-sm" onclick="setCategory('speed')" id="tab-speed">🚀 Speed</button>
      <button class="btn btn-outline btn-sm" onclick="setCategory('area')" id="tab-area">📐 Area</button>
    </div>

    <div class="row-3" style="gap:16px; align-items:end;">
      <div class="form-group" style="margin:0;">
        <label for="inputVal">Value</label>
        <input type="number" id="inputVal" placeholder="Enter value" oninput="convert()">
      </div>
      <div class="form-group" style="margin:0;">

        <select id="fromUnit" onchange="convert()"></select>
      </div>
      <div class="form-group" style="margin:0;">
        <label for="toUnit">To</label>
        <select id="toUnit" onchange="convert()"></select>
      </div>

<script src="../js/main.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/themes.js"></script>
<script src="../js/ads.js"></script>
<script src="../js/performance.js"></script>
<script>
const categories = {
  weight: {
    label: '⚖️ Common Weight Conversions',
    units: {
      kg: 1, g: 0.001, mg: 0.000001, lb: 0.453592, oz: 0.0283495,
      tonne: 1000, 'stone': 6.35029
    },
    quick: [
      ['1 kg', '2.205 lbs'], ['1 lb', '0.454 kg'], ['1 tonne', '1000 kg'],
      ['1 oz', '28.35 g'], ['1 stone', '6.35 kg'], ['100 g', '3.527 oz']
    ]
  },
  length: {
    label: '📏 Common Length Conversions',
    units: {
      m: 1, km: 1000, cm: 0.01, mm: 0.001, mile: 1609.34,
      yard: 0.9144, ft: 0.3048, inch: 0.0254, nauticalMile: 1852
    },
    quick: [
      ['1 km', '0.621 miles'], ['1 mile', '1.609 km'], ['1 m', '3.281 ft'],
      ['1 ft', '0.305 m'], ['1 inch', '2.54 cm'], ['100 cm', '1 m']
    ]
  },
  temperature: {
    label: '🌡️ Common Temperature Conversions',
    units: { '°C': 'celsius', '°F': 'fahrenheit', 'K': 'kelvin' },
    quick: [
      ['0°C', '32°F'], ['100°C', '212°F'], ['37°C (body)', '98.6°F'],
      ['20°C (room)', '68°F'], ['-40°C', '-40°F'], ['0 K', '-273.15°C']
    ],
    special: true
  },
  volume: {
    label: '💧 Common Volume Conversions',
    units: {
      L: 1, mL: 0.001, m3: 1000, cm3: 0.001,
      gallon: 3.78541, quart: 0.946353, pint: 0.473176,
      cup: 0.236588, flOz: 0.0295735, tbsp: 0.0147868, tsp: 0.00492892
    },
    quick: [
      ['1 L', '0.264 gallons'], ['1 gallon', '3.785 L'], ['1 cup', '236.6 mL'],
      ['1 pint', '473 mL'], ['1 fl oz', '29.57 mL'], ['1 tbsp', '14.79 mL']
    ]
  },
  speed: {
    label: '🚀 Common Speed Conversions',
    units: {
      'km/h': 1, 'm/s': 3.6, 'mph': 1.60934, 'knot': 1.852, 'ft/s': 1.09728
    },
    quick: [
      ['60 km/h', '37.3 mph'], ['100 km/h', '62.1 mph'], ['1 m/s', '3.6 km/h'],
      ['1 knot', '1.852 km/h'], ['Speed of light', '1.08B km/h'], ['Sound (air)', '1234 km/h']
    ]
  },
  area: {
    label: '📐 Common Area Conversions',
    units: {
      m2: 1, km2: 1e6, cm2: 0.0001, mm2: 1e-6,
      acre: 4046.86, hectare: 10000, ft2: 0.092903, inch2: 0.00064516,
      yard2: 0.836127, mile2: 2589988
    },
    quick: [
      ['1 acre', '4047 m²'], ['1 hectare', '10,000 m²'], ['1 km²', '247 acres'],
      ['1 m²', '10.76 ft²'], ['1 marla', '25.29 m²'], ['1 kanal', '505.86 m²']
    ]
  }
};

let currentCat = 'weight';

function setCategory(cat) {
  currentCat = cat;
  Object.keys(categories).forEach(c => {
    document.getElementById('tab-'+c).className = c === cat ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
  });
  buildSelects();
  buildQuickRef();
  document.getElementById('resultBox').classList.remove('show');
}

function buildSelects() {
  const cat = categories[currentCat];
  const from = document.getElementById('fromUnit');
  const to = document.getElementById('toUnit');
  const units = Object.keys(cat.units);
  from.innerHTML = units.map(u => `<option value="${u}">${u}</option>`).join('');
  to.innerHTML = units.map(u => `<option value="${u}">${u}</option>`).join('');
  if (units.length > 1) to.selectedIndex = 1;
}

function buildQuickRef() {
  const cat = categories[currentCat];
  document.getElementById('refTitle').textContent = cat.label;
  const rows = cat.quick.map(([from, to]) =>
    `<div style="display:flex; justify-content:space-between; padding:10px 14px; background:#f8f9fc; border-radius:8px; margin-bottom:6px; font-size:0.88rem;">
      <span>${from}</span><span style="color:var(--primary); font-weight:600;">= ${to}</span>
    </div>`
  ).join('');
  document.getElementById('refTable').innerHTML = rows;
}

function convert() {
  const val = parseFloat(document.getElementById('inputVal').value);
  const from = document.getElementById('fromUnit').value;
  const to = document.getElementById('toUnit').value;
  if (isNaN(val)) return;

  const cat = categories[currentCat];
  let result;

  if (cat.special) { // temperature
    let celsius;
    if (from === '°C') celsius = val;
    else if (from === '°F') celsius = (val - 32) * 5/9;
    else celsius = val - 273.15;

    if (to === '°C') result = celsius;
    else if (to === '°F') result = celsius * 9/5 + 32;
    else result = celsius + 273.15;
  } else {
    const base = val * cat.units[from];
    result = base / cat.units[to];
  }

  document.getElementById('resultVal').textContent = `${result.toFixed(6).replace(/\.?0+$/, '')} ${to}`;
  document.getElementById('resultSub').textContent = `${val} ${from} = ${result.toFixed(6).replace(/\.?0+$/, '')} ${to}`;
  document.getElementById('resultBox').classList.add('show');
}

function swapUnits() {
  const from = document.getElementById('fromUnit');
  const to = document.getElementById('toUnit');
  const tmp = from.value; from.value = to.value; to.value = tmp;
  convert();
}

setCategory('weight');
</script>
